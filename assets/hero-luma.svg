    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9ddc8"/><stop offset="1" stop-color="#c8b999"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f6efe3"/><stop offset="1" stop-color="#d3c6b0"/></linearGradient>
    <linearGradient id="shade"><stop stop-color="#c5b69a"/><stop offset="1" stop-color="#e9dfcf"/></linearGradient>
    <clipPath id="arch"><path d="M738 586V313a135 135 0 0 1 270 0v273Z"/></clipPath>
  </defs>
  <rect width="1200" height="800" fill="#f7f5ef"/>
