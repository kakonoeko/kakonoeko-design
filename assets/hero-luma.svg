    <text x="84" y="205" font-size="11" letter-spacing="2.5" fill="#596a5c">DISEÑO QUE SE SIENTE</text>
    <g fill="#283e35" font-size="76" font-weight="500" letter-spacing="-4">
      <text x="62" y="302">Espacios</text><text x="62" y="385">para vivir</text><text x="62" y="468" font-family="Georgia, serif" font-style="italic" fill="#7a896a">mejor.</text>
    </g>
    <g fill="#6c756b" font-size="17"><text x="66" y="523">Luz, calma y materiales que cuentan tu historia.</text><text x="66" y="552">Creamos lugares con una forma propia de ser.</text></g>
