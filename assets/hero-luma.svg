    <text x="62" y="99" font-size="9" letter-spacing="2.2">ARQUITECTURA &amp; INTERIORES</text>
    <g font-size="12"><text x="600" y="73">El estudio</text><text x="716" y="73">Proyectos</text><text x="831" y="73">Nuestra mirada</text></g>
    <rect x="1006" y="43" width="135" height="46" rx="23" fill="none" stroke="#283e35"/>
