<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Luma, diseño de una web de arquitectura e interiores</title>
  <desc id="desc">Una portada en tonos crema y verde con el titular Espacios para vivir mejor, una ilustración arquitectónica y un botón para descubrir proyectos.</desc>
